# Manual .NET build workflow with path filtering
# This supplements the auto-generated nuke-build.yml with path-specific triggers

name: .NET DataJam Build

on:
  push:
    paths:
      - 'src/**'
      - 'build/**'
      - '*.sln'
      - '*.props'
      - '*.targets'
      - 'global.json'
      - '.github/workflows/dotnet-build.yml'
    branches:
      - main
      - develop
      - 'feature/**'
  pull_request:
    paths:
      - 'src/**'
      - 'build/**'
      - '*.sln'
      - '*.props'
      - '*.targets'
      - 'global.json'
      - '.github/workflows/dotnet-build.yml'

permissions:
  contents: read
  actions: write

jobs:
  dotnet-build:
    name: .NET Build and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache .nuke/temp and NuGet packages
        uses: actions/cache@v4
        with:
          path: |
            .nuke/temp
            ~/.nuget/packages
          key: ${{ runner.os }}-${{ hashFiles('**/global.json', '**/*.csproj', '**/Directory.Packages.props') }}

      - name: Install .NET 8 SDK
        uses: actions/setup-dotnet@v4.1.0
        with:
          dotnet-version: 8.0.x
          dotnet-quality: ga

      - name: Install .NET 9 SDK
        uses: actions/setup-dotnet@v4.1.0
        with:
          dotnet-version: 9.0.x
          dotnet-quality: ga

      - name: Run NUKE build
        run: ./build.cmd Nuke
        env:
          NuGetApiKey: ${{ secrets.NUGET_API_KEY }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-artifacts
          path: artifacts